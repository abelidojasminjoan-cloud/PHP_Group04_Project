; Render runtime environment variables are exposed to the existing $_ENV config.
variables_order = "EGPCS"
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = Asia/Manila

; Five review photos can be uploaded in one request.
upload_max_filesize = 5M
post_max_size = 40M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120

session.save_path = /var/www/storage/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 86400

opcache.enable = 1
opcache.validate_timestamps = 0
