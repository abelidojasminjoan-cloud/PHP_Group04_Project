ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app/public
    DirectoryIndex index.php

    <Directory /var/www/app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    # The source directories behind the explicitly created public links.
    <DirectoryMatch "^/var/www/app/(public|assets|actions|account|admin|staff)(/|$)">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </DirectoryMatch>

    <Directory /var/www/storage>
        AllowOverride None
        Require all denied
    </Directory>

    # Uploaded images are served as data and can never execute as PHP.
    <Directory /var/www/storage/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; sandbox"
        <FilesMatch "(?i)\.(jpe?g|png|webp)$">
            Require all granted
            SetHandler default-handler
        </FilesMatch>
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
